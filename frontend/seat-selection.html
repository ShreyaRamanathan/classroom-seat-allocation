<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Your Seat · Classroom Seat Allocation System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <div class="app-header">
    <div class="brand-row">
      <div class="brand-icon-sm">🪑</div>
      <div>
        <h2 id="classroomTitle">Select Your Seat</h2>
        <div class="sub" id="classroomSub">Loading classroom...</div>
      </div>
    </div>
    <a href="dashboard.html" class="btn btn-outline" style="width:auto; padding:10px 18px;">← Back to Dashboard</a>
  </div>

  <div id="banner" class="banner"></div>

  <div class="seat-map-card">
    <div class="teacher-desk">🧑‍🏫 FRONT — TEACHER'S DESK</div>

    <div id="seatGrid" class="seat-grid">
      <div class="loading-text">Loading seats...</div>
    </div>

    <div class="legend">
      <span><i class="swatch" style="background:var(--seat-available)"></i> Available</span>
      <span><i class="swatch" style="background:var(--seat-occupied)"></i> Occupied</span>
      <span><i class="swatch" style="background:var(--seat-selected)"></i> Selected</span>
      <span><i class="swatch" style="background:var(--seat-disabled)"></i> Unavailable</span>
    </div>

    <div id="confirmPanel" class="confirm-panel">
      <div class="cp-seat" id="cpSeatText">You have selected Seat —</div>
      <div class="cp-sub">Confirm to book this seat, or pick a different one.</div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="changeSeat()">Change Seat</button>
        <button class="btn btn-primary" id="confirmBtn" onclick="confirmSeat()">Confirm Seat</button>
      </div>
    </div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/seats.js"></script>
</body>
</html>
