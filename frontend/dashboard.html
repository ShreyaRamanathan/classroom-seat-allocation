<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Classroom Seat Allocation System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <div class="app-header">
    <div class="brand-row">
      <div class="brand-icon-sm">🎓</div>
      <div>
        <h2>Classroom Seat Allocation</h2>
        <div class="sub">Student Dashboard</div>
      </div>
    </div>
    <button class="logout-link" onclick="logout()">Logout</button>
  </div>

  <div class="welcome-card">
    <h3 id="welcomeName">Welcome back!</h3>
    <p id="welcomeId">Student ID: —</p>
  </div>

  <div id="bookedSection"></div>

  <div id="banner" class="banner"></div>

  <div class="section-title">🏫 Choose a Classroom</div>
  <div id="classroomList" class="classroom-list">
    <div class="loading-text">Loading classrooms...</div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
